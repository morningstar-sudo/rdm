name: Build Windows app and Edge extension

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Run Rust tests
        run: cargo test --locked

      - name: Build Windows executable
        run: cargo build --release --locked --target x86_64-pc-windows-msvc --bins

      - name: Package app and Edge extension
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dist = Join-Path $PWD 'dist'
          $bundle = Join-Path $dist 'RDM-Windows-x64'
          New-Item -ItemType Directory -Force -Path $bundle | Out-Null
          Copy-Item 'target\x86_64-pc-windows-msvc\release\rdm.exe' (Join-Path $bundle 'rdm.exe')
          Copy-Item 'target\x86_64-pc-windows-msvc\release\rdm.exe' (Join-Path $bundle 'rdm-host.exe')
          Copy-Item 'target\x86_64-pc-windows-msvc\release\rdm.exe' (Join-Path $dist 'rdm.exe')
          Copy-Item 'target\x86_64-pc-windows-msvc\release\rdm.exe' (Join-Path $dist 'rdm-host.exe')
          Copy-Item 'apps\Rdm.Extension' (Join-Path $bundle 'Rdm.Extension') -Recurse
          Copy-Item 'README.md' (Join-Path $bundle 'README.md')

          $extension = Get-Content 'apps\Rdm.Extension\manifest.json' -Raw | ConvertFrom-Json
          if ($extension.manifest_version -ne 3 -or -not $extension.key) {
            throw 'The Edge extension manifest must be MV3 and have a stable public key.'
          }
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $keyHash = $sha256.ComputeHash([Convert]::FromBase64String($extension.key))
          $sha256.Dispose()
          $extensionId = ''
          foreach ($byte in $keyHash[0..15]) {
            $extensionId += [char](97 + ($byte -shr 4))
            $extensionId += [char](97 + ($byte -band 15))
          }
          if ($extensionId -ne 'agdholmngaiajkafecfkonjoijmnjfic') {
            throw "Extension ID does not match the ID allowed by the native host: $extensionId"
          }
          foreach ($file in @('service_worker.js', 'popup.html', 'popup.js', 'popup.css')) {
            if (-not (Test-Path (Join-Path 'apps\Rdm.Extension' $file) -PathType Leaf)) {
              throw "Extension file is missing: $file"
            }
          }

          Compress-Archive -Path (Join-Path $bundle '*') -DestinationPath (Join-Path $dist 'RDM-Windows-x64.zip') -Force
          Compress-Archive -Path 'apps\Rdm.Extension\*' -DestinationPath (Join-Path $dist 'Rdm-Edge-Extension.zip') -Force
          $packageHash = (Get-FileHash 'dist\RDM-Windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          [System.IO.File]::WriteAllText(
            (Join-Path $dist 'RDM-Windows-x64.zip.sha256'),
            "$packageHash  RDM-Windows-x64.zip`n",
            [System.Text.UTF8Encoding]::new($false)
          )
          $cargoManifest = Get-Content 'Cargo.toml' -Raw
          $versionMatch = [regex]::Match($cargoManifest, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $versionMatch.Success) {
            throw 'Could not determine the app version from Cargo.toml.'
          }
          "RDM_VERSION=$($versionMatch.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw "Inno Setup compiler not found: $compiler"
          }
          & $compiler "/DRdmVersion=$env:RDM_VERSION" 'installer\RDM.iss'
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }
          if (-not (Test-Path 'dist\RDM-Setup-x64.exe' -PathType Leaf)) {
            throw 'The Windows installer was not created.'
          }
          if (-not (Test-Path 'dist\RDM-Windows-x64.zip.sha256' -PathType Leaf)) {
            throw 'The latest-package SHA-256 file was not created.'
          }
          if (-not (Test-Path 'dist\rdm-host.exe' -PathType Leaf)) {
            throw 'The dedicated Edge native messaging host was not packaged.'
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rdm-windows-x64
          path: |
            dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          name: rdm-windows-x64
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: RDM ${{ github.ref_name }}
          make_latest: true
          generate_release_notes: true
          files: |
            dist/RDM-Setup-x64.exe
            dist/rdm.exe
            dist/rdm-host.exe
            dist/RDM-Windows-x64.zip
            dist/RDM-Windows-x64.zip.sha256
            dist/Rdm-Edge-Extension.zip
